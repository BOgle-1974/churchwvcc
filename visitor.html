<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Connect Card - West Village Christian Church</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="site-nav" style="text-align: center; padding: 15px; background: #f4f4f4; border-bottom: 1px solid #ddd;">
        <a href="index.html">Home</a> | 
        <a href="livestream.html">Livestream</a> | 
        <a href="archive.html">Archive</a> | 
        <a href="visitor.html">Visitor Connect</a> | 
        <a href="prayer.html">Prayer Requests</a> | 
        <a href="donate.html">Donate</a>
    </nav>

    <div class="form-container">
        <h2>Visitor Connect Card</h2>
        <form id="visitorForm">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="firstTime">First time visiting?</label>
            <select id="firstTime" name="firstTime">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label for="hearAbout">How did you hear about us?</label>
            <input type="text" id="hearAbout" name="hearAbout">

            <label for="contactMethod">Preferred Contact Method</label>
            <select id="contactMethod" name="contactMethod">
                <option value="Email">Email</option>
                <option value="Phone">Phone</option>
                <option value="Text">Text</option>
            </select>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments"></textarea>

            <button type="submit" class="submit-btn-visitor">Submit Connect Card</button>
        </form>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <script>
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        const form = document.getElementById('visitorForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Thank you! Your visitor connect card has been submitted.');
                    form.reset();
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
