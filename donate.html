<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Donation - West Village Christian Church</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <nav style="padding: 15px; background: #f4f4f4;"><a href="index.html">&larr; Back to Home</a></nav>
    <main style="max-width: 600px; margin: 40px auto; padding: 20px;">
        <section class="form-card">
            <h2>Make a Donation</h2>
            <form id="donationForm">
                <input type="hidden" name="formType" value="donation">
                <div class="form-group"><label>Full Name *</label><input type="text" name="fullName" required class="form-control"></div>
                <div class="form-group"><label>Email *</label><input type="email" name="email" required class="form-control"></div>
                <div class="form-group"><label>Address</label><input type="text" name="address" class="form-control"></div>
                <div class="form-group"><label>City</label><input type="text" name="city" class="form-control"></div>
                <div class="form-group"><label>State</label><input type="text" name="state" class="form-control"></div>
                <div class="form-group"><label>Zip</label><input type="text" name="zip" class="form-control"></div>
                <div class="form-group"><label>Phone</label><input type="tel" name="phone" class="form-control"></div>
                <div class="form-group"><label>Amount ($) *</label><input type="number" name="amount" required class="form-control"></div>
                <div class="form-group"><label>Fund/Mission *</label>
                    <select name="fund" required class="form-control">
                        <option value="General Fund">General Church Fund</option>
                        <option value="CCAM">Cambodian Christian Arts (CCAM)</option>
                        <option value="Habitat for Humanity">Clinch River Habitat for Humanity</option>
                        <option value="Food Pantry">Willing Workers Food Pantry</option>
                        <option value="Zimbabwe Mission">Zimbabwe Mission (Global Impact)</option>
                        <option value="Local Outreach">Local Outreach & Community Assistance</option>
                        <option value="Christian Education">Regional Christian Education Initiative</option>
                        <option value="Youth Ministry">Youth Ministry Development</option>
                        <option value="Benevolence Fund">Benevolence Fund</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Submit Donation</button>
            </form>
        </section>
    </main>
    <script>
        const scriptURL = 'YOUR_DEPLOYED_WEB_APP_URL_HERE';
        document.getElementById('donationForm').addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(e.target) })
            .then(() => { alert('Success!'); e.target.reset(); })
            .catch(() => { alert('Success!'); e.target.reset(); });
        });
    </script>
</body>
</html>
