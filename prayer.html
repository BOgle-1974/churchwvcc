<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Request Box - West Village Christian Church</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="site-nav" style="text-align: center; padding: 15px; background: #f4f4f4; border-bottom: 1px solid #ddd;">
        <a href="index.html">Home</a> | 
        <a href="visitor.html">Visitor Connect</a> | 
        <a href="prayer.html">Prayer Requests</a> | 
        <a href="donate.html">Donate</a>
    </nav>

    <div class="form-container">
        <h2>Prayer Request Box</h2>
        <form id="prayerForm">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="prayerRequest">Prayer Request *</label>
            <textarea id="prayerRequest" name="prayerRequest" required></textarea>

            <label for="keepPrivate">Keep Private?</label>
            <select id="keepPrivate" name="keepPrivate">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>

            <button type="submit" class="submit-btn-prayer">Submit Prayer Request</button>
        </form>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <script>
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        const form = document.getElementById('prayerForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Thank you! Your prayer request has been submitted.');
                    form.reset();
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
