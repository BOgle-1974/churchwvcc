<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Requests - West Village Christian Church</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="site-nav" style="text-align: center; padding: 15px; background: #f4f4f4; border-bottom: 1px solid #ddd;">
        <a href="index.html">Home</a> | 
        <a href="livestream.html">Livestream</a> | 
        <a href="archive.html">Archive</a> | 
        <a href="visitor.html">Visitor Connect</a> | 
        <a href="prayer.html">Prayer Requests</a> | 
        <a href="donate.html">Donate</a>
    </nav>

    <!-- Navy Blue Hero Banner -->
    <div class="hero-banner">
        <h3>WEST VILLAGE CHRISTIAN CHURCH</h3>
        <h1>Rooted in Faith. Driven by Missions.</h1>
        <p>"Do not be anxious about anything, but in every situation... present your requests to God." — Philippians 4:6</p>
    </div>

    <div class="form-container">
        <h2>Prayer Request Form</h2>
        <form id="prayerForm">
            <!-- Hidden input for the Apps Script router -->
            <input type="hidden" name="formType" value="prayer">

            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="prayerRequest">Prayer Request *</label>
            <textarea id="prayerRequest" name="prayerRequest" required></textarea>

            <label for="isPrivate">Is this request private (pastor only)?</label>
            <select id="isPrivate" name="isPrivate">
                <option value="No">No (Share with Prayer Team)</option>
                <option value="Yes">Yes (Pastor Only)</option>
            </select>

            <button type="submit" class="submit-btn-prayer">Submit Prayer Request</button>
        </form>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <script>
        // Use your newly updated Web app URL here
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzM4AKlVJOZ3RZ_Bldv37-ussjgLUc4Z9rQhpQJ5CjzSeLqI1IphknM27WN9Be0CFA9IA/exec';
        const form = document.getElementById('prayerForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Thank you! Your prayer request has been submitted.');
                    form.reset();
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
